name: Crawler

on:
  schedule:
    - cron: "13,43 * * * *"
      timezone: America/Sao_Paulo
  workflow_dispatch:

concurrency:
  group: crawler-prod
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Collect and persist observations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m crawler.jobs.run --save
