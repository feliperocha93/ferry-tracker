[project]
name = "ferry-wait"
version = "0.1.0"
description = "Coleta e previsão de tempo de espera em travessias de balsa (SEMIL/DERSA)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "beautifulsoup4>=4.12",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["crawler/tests"]
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler", "shared"]
